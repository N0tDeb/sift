[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sift-lint"
dynamic = ["version"]
description = "A linter for tabular data files. Finds the problems that survive a successful load."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
maintainers = [{ name = "N0tDeb" }]
keywords = ["csv", "excel", "parquet", "data-quality", "linter", "etl", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14.0"]
all = ["openpyxl>=3.1", "pyarrow>=14.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "openpyxl>=3.1", "pyarrow>=14.0"]

[project.urls]
Homepage = "https://github.com/N0tDeb/sift"
Documentation = "https://github.com/N0tDeb/sift/blob/main/docs/PROJECT_GUIDE.md"
Repository = "https://github.com/N0tDeb/sift"
Issues = "https://github.com/N0tDeb/sift/issues"
Changelog = "https://github.com/N0tDeb/sift/blob/main/CHANGELOG.md"

[project.scripts]
sift-lint = "sift_lint.cli:main"

[tool.hatch.version]
path = "sift_lint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sift_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
