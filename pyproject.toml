[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sift-csv"
version = "0.1.0"
description = "A linter for tabular data files. Finds the problems that survive a successful load."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["csv", "excel", "parquet", "data-quality", "linter", "etl", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14.0"]
all = ["openpyxl>=3.1", "pyarrow>=14.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "openpyxl>=3.1", "pyarrow>=14.0"]

[project.scripts]
sift = "sift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
