name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # Recall against known corruptions. Fails the build if Sift starts
      # missing problems it used to catch, or starts inventing them on a
      # file that is clean.
      - run: python -m bench.run

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sift-wheel"
          "$RUNNER_TEMP/sift-wheel/bin/python" -m pip install --no-deps dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$RUNNER_TEMP/sift-wheel/bin/python" -c "import sift; print(sift.__version__)"
          "$RUNNER_TEMP/sift-wheel/bin/sift" --help >/dev/null
          "$RUNNER_TEMP/sift-wheel/bin/sift" check \
            "$GITHUB_WORKSPACE/examples/orders_messy.csv" --no-config --fail-on none >/dev/null
          "$RUNNER_TEMP/sift-wheel/bin/python" -m pip check

  # Sift running against its own example data, which is the way it is meant to
  # be used: a gate that fails the build when a file changes for the worse.
  data-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]"
      - name: Lint the example files
        run: sift check examples/ --fail-on none
      - name: Compare against the baseline
        run: sift diff examples/orders_baseline.csv examples/orders_messy.csv --fail-on none
      - name: Repair what is safely repairable
        run: sift fix examples/orders_messy.csv --force --dry-run
      - name: Report the blast radius
        run: sift impact examples/orders_messy.csv --sum order_total --group-by region
