name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            experimental: false
          - os: ubuntu-24.04
            python-version: "3.12"
            experimental: false
          - os: ubuntu-24.04
            python-version: "3.13"
            experimental: false
          - os: ubuntu-24.04
            python-version: "3.14"
            experimental: false
          # Python 3.15 is newly released; the exploratory job must not block
          # established Python and OS compatibility checks.
          - os: ubuntu-24.04
            python-version: "3.15"
            experimental: true
          - os: windows-2025
            python-version: "3.14"
            experimental: false
          - os: macos-15
            python-version: "3.14"
            experimental: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # Preserve the benchmark's corruption-detection and clean-control gates.
      - run: python -m bench.run

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install build validation tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate and smoke-test distributions
        run: python .github/scripts/check_distributions.py

  # Sift is also used as a data gate against its own examples.
  data-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]"
      - name: Lint the example files
        run: sift-lint check examples/ --fail-on none
      - name: Compare against the baseline
        run: sift-lint diff examples/orders_baseline.csv examples/orders_messy.csv --fail-on none
      - name: Repair what is safely repairable
        run: sift-lint fix examples/orders_messy.csv --force --dry-run
      - name: Report the blast radius
        run: sift-lint impact examples/orders_messy.csv --sum order_total --group-by region
